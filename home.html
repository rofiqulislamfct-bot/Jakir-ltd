<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAKIR LTD Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-4">
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            return (
                <div className="max-w-md mx-auto bg-slate-900 rounded-xl p-6 shadow-xl border border-slate-800 mt-10">
                    <h1 className="text-2xl font-bold text-center text-emerald-400 mb-2">JAKIR LTD</h1>
                    <p className="text-center text-slate-400 mb-6">Business Management System</p>
                    <div className="bg-slate-800 p-4 rounded-lg text-center">
                        <p className="text-green-400 font-semibold">✔ সিস্টেম সফলভাবে চালু হয়েছে!</p>
                        <p className="text-xs text-slate-400 mt-2">আপনার ড্যাশবোর্ড এখন লাইভ কাজ করছে।</p>
                    </div>
                </div>
            );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
