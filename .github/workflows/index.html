<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAKIR LTD - HANIF DOOR Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- FontAwesome for fallback -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Hind Siliguri', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .printable-area {
            display: none;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #printChallanSection, #printChallanSection * {
                visibility: visible;
            }
            #printChallanSection {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                display: block !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-40 px-4 py-3 no-print">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- Brand Info -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-cyan-500/20">
                    JL
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none text-white tracking-wide">JAKIR LTD</h1>
                    <p class="text-xs text-cyan-400 font-medium">HANIF DOOR Factory Portal</p>
                </div>
            </div>

            <!-- Role Selector & Dark Toggle -->
            <div class="flex items-center space-x-2 space-x-reverse">
                <select id="roleSelector" onchange="switchRole(this.value)" class="bg-slate-900 border border-slate-700 text-cyan-300 text-xs font-semibold rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                    <option value="owner">মালিক ড্যাশবোর্ড (Owners)</option>
                    <option value="manager">ম্যানেজার ড্যাশবোর্ড</option>
                    <option value="driver">ড্রাইভার ড্যাশবোর্ড (Trip GPS)</option>
                    <option value="employee">স্টাফ / কর্মী ড্যাশবোর্ড</option>
                </select>
                <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-700/50 hover:bg-slate-700 text-slate-300">
                    <i data-lucide="moon" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto w-full p-4 space-y-6 flex-1 no-print">

        <!-- Role Banner Notification -->
        <div id="roleBanner" class="bg-gradient-to-r from-cyan-900/40 via-slate-800 to-slate-800 border-l-4 border-cyan-500 rounded-r-xl p-4 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="p-2 rounded-lg bg-cyan-500/10 text-cyan-400">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <div>
                    <h2 id="currentRoleTitle" class="font-semibold text-sm text-white">মালিক প্যানেল (Equal Ownership Access)</h2>
                    <p id="currentRoleDesc" class="text-xs text-slate-400">জাকির হোসেন, রফিকুল ইসলাম হৃদয় ও আবু সাকের জীবন - সমক্ষমতা সম্পন্ন ৩ জন অন
