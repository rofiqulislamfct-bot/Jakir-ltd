
name: Build Zakir Limited APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Find Flutter project
        shell: bash
        run: |
          if [ -f pubspec.yaml ]; then
            APP_DIR="$GITHUB_WORKSPACE"
          else
            ZIP=$(find . -maxdepth 3 -name '*.zip' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "No Flutter project or ZIP file found"
              exit 1
            fi
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
            PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)
            if [ -z "$PUBSPEC" ]; then
              echo "pubspec.yaml not found in ZIP"
              exit 1
            fi
            APP_DIR="$(dirname "$PUBSPEC")"
          fi
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: |
          cd "$APP_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zakir-Limited-Android-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
