<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হানিফ ডোর - জাকির লিমিটেড</title>
    
    <!-- PWA Manifest & Settings -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"JAKIR LTD - Hanif Door","short_name":"JAKIR LTD","start_url":"./","display":"standalone","background_color":"#0f172a","theme_color":"#10b981","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/5968/5968260.png","sizes":"512x512","type":"image/png"}]}'>
    <meta name="theme-color" content="#10b981">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        darkBg: '#0F172A',
                        cardBg: '#1E293B'
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printable-challan, #printable-challan * { visibility: visible; }
            #printable-challan { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; padding: 20px; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [user, setUser] = React.useState(null);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('dashboard');
            
            // Orders State
            const [orders, setOrders] = React.useState([
                { id: 'MEMO-1001', customer: 'আলমগীর হোসেন', phone: '01711000000', address: 'মিরপুর, ঢাকা', product: 'হানিফ সেগুন ডোর (39"x84")', qty: 4, total: 48000, advance: 10000, due: 38000, status: 'প্রোডাকশনে আছে' }
            ]);

            // New Order Form State
            const [newOrder, setNewOrder] = React.useState({ customer: '', phone: '', address: '', product: '', qty: 1, price: 0, advance: 0 });
            const [selectedChallan, setSelectedChallan] = React.useState(null);

            const handleLogin = (e) => {
                e.preventDefault();
                if (email.includes('owner') || email === 'zakir@jakirltd.com') {
                    setUser({ name: 'জাকির হোসেন (Chairman / Owner)', role: 'owner' });
                } else if (email.includes('manager')) {
                    setUser({ name: 'ফ্যাক্টরি ম্যানেজার', role: 'manager' });
                } else if (email.includes('driver')) {
                    setUser({ name: 'ডেলিভারি ড্রাইভার', role: 'driver' });
                } else {
                    setUser({ name: 'সাধারণ কর্মচারী', role: 'employee' });
                }
            };

            const handleCreateOrder = (e) => {
                e.preventDefault();
                const total = newOrder.qty * newOrder.price;
                const due = total - newOrder.advance;
                const orderObj = {
                    id: `MEMO-${1000 + orders.length + 1}`,
                    customer: newOrder.customer,
                    phone: newOrder.phone,
                    address: newOrder.address,
                    product: newOrder.product,
                    qty: newOrder.qty,
                    total: total,
                    advance: newOrder.advance,
                    due: due,
                    status: 'প্রোডাকশনে আছে'
                };
                setOrders([...orders, orderObj]);
                setNewOrder({ customer: '', phone: '', address: '', product: '', qty: 1, price: 0, advance: 0 });
                alert('নতুন মেমো সফলভাবে তৈরি হয়েছে!');
            };

            const handlePrint = (order) => {
                setSelectedChallan(order);
                setTimeout(() => {
                    window.print();
                }, 300);
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
                            <div className="text-center mb-8">
                                <h1 className="text-2xl font-bold text-emerald-400">হানিফ ডোর</h1>
                                <p className="text-sm text-slate-400 mt-1">জাকির লিমিটেড ম্যানেজমেন্ট সিস্টেম</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">ইমেইল বা ইউজার আইডি</label>
                                    <input 
                                        type="text" required placeholder="owner@jakirltd.com বা manager@..." 
                                        value={email} onChange={(e) => setEmail(e.target.value)}
                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">পাসওয়ার্ড</label>
                                    <input 
                                        type="password" required placeholder="••••••••" 
                                        value={password} onChange={(e) => setPassword(e.target.value)}
                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500"
                                    />
                                </div>
                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg">
                                    লগইন করুন
                                </button>
                                <p className="text-xs text-center text-slate-500 mt-4">
                                    টিপস: Owner হিসেবে ঢুকতে ইমেইলে 'owner' লিখে লগইন করুন।
                                </p>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center">
                        <div>
                            <h1 className="font-bold text-emerald-400">হানিফ ডোর - জাকির লিমিটেড</h1>
                            <p className="text-xs text-slate-400">ব্যবহারকারী: {user.name} ({user.role.toUpperCase()})</p>
                        </div>
                        <button onClick={() => setUser(null)} className="bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-medium">
                            লগআউট
                        </button>
                    </header>

                    <nav className="bg-slate-900/50 border-b border-slate-800 px-4 py-2 flex gap-2 overflow-x-auto text-sm">
                        <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-1.5 rounded-lg whitespace-nowrap ${activeTab === 'dashboard' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>ড্যাশবোর্ড</button>
                        <button onClick={() => setActiveTab('orders')} className={`px-3 py-1.5 rounded-lg whitespace-nowrap ${activeTab === 'orders' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>মেমো ও অর্ডার</button>
                    </nav>

                    <main className="p-4 flex-1 max-w-7xl w-full mx-auto space-y-4">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                        <p className="text-xs text-slate-400">মোট অর্ডার</p>
                                        <h3 className="text-xl font-bold text-emerald-400 mt-1">{orders.length} টি</h3>
                                    </div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                    <h2 className="text-lg font-bold mb-2">হানিফ ডোর ম্যানেজমেন্ট প্যানেল</h2>
                                    <p className="text-sm text-slate-400">এখানে তিন সমান ক্ষমতার মালিক (জাকির হোসেন, রফিকুল ইসলাম হৃদয়, আবু সাকের জীবন) যৌথভাবে কারখানা পরিচালনা করছেন।</p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'orders' && (
                            <div className="space-y-6">
                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                    <h2 className="text-lg font-bold text-emerald-400 mb-4">নতুন মেমো / অর্ডার তৈরি করুন</h2>
                                    <form onSubmit={handleCreateOrder} className="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                                        <div>
                                            <label className="block text-slate-400 mb-1">গ্রাহকের নাম</label>
                                            <input type="text" required placeholder="নাম" value={newOrder.customer} onChange={(e) => setNewOrder({...newOrder, customer: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-400 mb-1">মোবাইল নম্বর</label>
                                            <input type="text" required placeholder="ফোন" value={newOrder.phone} onChange={(e) => setNewOrder({...newOrder, phone: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-400 mb-1">ঠিকানা</label>
                                            <input type="text" required placeholder="ঠিকানা" value={newOrder.address} onChange={(e) => setNewOrder({...newOrder, address: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-400 mb-1">পণ্যের বিবরণ (ডোর)</label>
                                            <input type="text" required placeholder="দরজার বিবরণ" value={newOrder.product} onChange={(e) => setNewOrder({...newOrder, product: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-400 mb-1">পরিমাণ (পিস)</label>
                                            <input type="number" min="1" required value={newOrder.qty} onChange={(e) => setNewOrder({...newOrder, qty: Number(e.target.value)})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-400 mb-1">প্রতি পিস মূল্য (টাকা)</label>
                                            <input type="number" required value={newOrder.price} onChange={(e) => setNewOrder({...newOrder, price: Number(e.target.value)})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-400 mb-1">অ্যাডভান্স পেমেন্ট (টাকা)</label>
                                            <input type="number" value={newOrder.advance} onChange={(e) => setNewOrder({...newOrder, advance: Number(e.target.value)})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white" />
                                        </div>
                                        <div className="md:col-span-3 flex justify-end">
                                            <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-lg transition">
                                                মেমো সেভ করুন ও প্রিন্ট প্রস্তুত করুন
                                            </button>
                                        </div>
                                    </form>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-4">
                                    <h2 className="text-lg font-bold text-emerald-400">সকল মেমো ও ডেলিভারি চালান</h2>
                                    <div className="space-y-3">
                                        {orders.map((ord) => (
                                            <div key={ord.id} className="bg-slate-800/60 p-4 rounded-xl border border-slate-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                                <div>
                                                    <span className="text-xs font-bold text-emerald-400">{ord.id}</span>
                                                    <h3 className="font-bold text-base text-white">{ord.customer} ({ord.phone})</h3>
                                                    <p className="text-xs text-slate-400">ঠিকানা: {ord.address} | পণ্য: {ord.product} x {ord.qty} পিস</p>
                                                    <p className="text-xs text-slate-300 mt-1">মোট: ৳ {ord.total} | অ্যাডভান্স: ৳ {ord.advance} | বকেয়া: <span className="text-amber-400 font-bold">৳ {ord.due}</span></p>
                                                </div>
                                                <button onClick={() => handlePrint(ord)} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-bold transition">
                                                    🖨️ প্রিন্ট চালান (A4)
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Hidden Printable Challan Area */}
                    {selectedChallan && (
                        <div id="printable-challan" className="hidden">
                            <div className="border-b-2 border-emerald-600 pb-4 mb-4 flex justify-between items-center">
                                <div>
                                    <h1 className="text-2xl font-bold text-emerald-700">হানিফ ডোর</h1>
                                    <p className="text-xs text-slate-600">জাকির লিমিটেড | ডোর ম্যানুফ্যাকচারিং ইউনিট</p>
                                </div>
                                <div className="text-right">
                                    <h2 className="text-lg font-bold text-slate-800">ডিজিটাল ডেলিভারি চালান</h2>
                                    <p className="text-xs text-slate-500">মেমো নং: {selectedChallan.id}</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4 my-6 text-xs text-slate-800">
                                <div>
                                    <p className="font-bold">গ্রাহকের তথ্য:</p>
                                    <p className="text-sm font-semibold">{selectedChallan.customer}</p>
                                    <p>ফোন: {selectedChallan.phone}</p>
                                    <p>ঠিকানা: {selectedChallan.address}</p>
                                </div>
                                <div className="text-right">
                                    <p className="font-bold">তারিখ ও তথ্য:</p>
                                    <p>তারিখ: {new Date().toLocaleDateString('bn-BD')}</p>
                                    <p>প্রতিষ্ঠান: হানিফ ডোর</p>
                                </div>
                            </div>
                            <table className="w-full text-left text-xs border-collapse border border-slate-300 my-4 text-slate-800">
                                <thead>
                                    <tr className="bg-slate-100 border-b border-slate-300">
                                        <th className="p-2 border border-slate-300">পণ্যের বিবরণ</th>
                                        <th className="p-2 border border-slate-300 text-center">পরিমাণ</th>
                                        <th className="p-2 border border-slate-300 text-right">মোট মূল্য</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td className="p-2 border border-slate-300">{selectedChallan.product}</td>
                                        <td className="p-2 border border-slate-300 text-center">{selectedChallan.qty} পিস</td>
                                        <td className="p-2 border border-slate-300 text-right">৳ {selectedChallan.total}</td>
                                    </tr>
                                </tbody>
                            </table>
                            <div className="flex justify-between items-end pt-6 text-xs text-slate-800">
                                <p>গ্রাহকের স্বাক্ষর: ____________________</p>
                                <div className="text-right space-y-1">
                                    <p>মোট টাকা: ৳ {selectedChallan.total}</p>
                                    <p>অ্যাডভান্স জমা: ৳ {selectedChallan.advance}</p>
                                    <p className="font-bold text-sm text-emerald-800">বকেয়া পাওনা: ৳ {selectedChallan.due}</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
