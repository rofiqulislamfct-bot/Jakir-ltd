<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হানিফ ডোর - জাকির লিমিটেড</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        darkBg: '#0F172A',
                        cardBg: '#1E293B'
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [user, setUser] = React.useState(() => {
                const saved = localStorage.getItem('hanif_user');
                return saved ? JSON.parse(saved) : null;
            });
            const [selectedRole, setSelectedRole] = React.useState('zakir');

            const handleLogin = (e) => {
                e.preventDefault();
                let loggedUser = { name: selectedRole, role: 'owner' };
                if (selectedRole === 'zakir') loggedUser = { name: 'জাকির হোসেন (ম্যানেজিং ডিরেক্টর)', role: 'owner' };
                else if (selectedRole === 'hriday') loggedUser = { name: 'রফিকুল ইসলাম হৃদয় (পরিচালক)', role: 'owner' };
                else if (selectedRole === 'jiban') loggedUser = { name: 'আবু সাকের জীবন (পরিচালক)', role: 'owner' };
                else if (selectedRole.includes('manager')) loggedUser = { name: 'ফ্যাক্টরি ম্যানেজার', role: 'manager' };
                else loggedUser = { name: 'কারখানার কর্মী / ড্রাইভার', role: 'employee' };

                setUser(loggedUser);
                localStorage.setItem('hanif_user', JSON.stringify(loggedUser));
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('hanif_user');
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
                            <div className="text-center mb-6">
                                <h1 className="text-2xl font-bold text-emerald-400">হানিফ ডোর</h1>
                                <p className="text-sm text-slate-400 mt-1">জাকির লিমিটেড ম্যানেজমেন্ট সিস্টেম</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm text-slate-300 mb-2">আপনার পদ বা নাম সিলেক্ট করুন</label>
                                    <select 
                                        value={selectedRole} 
                                        onChange={(e) => setSelectedRole(e.target.value)}
                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500"
                                    >
                                        <option value="zakir">১. জাকির হোসেন (ম্যানেজিং ডিরেক্টর)</option>
                                        <option value="hriday">২. রফিকুল ইসলাম হৃদয় (পরিচালক)</option>
                                        <option value="jiban">৩. আবু সাকের জীবন (পরিচালক)</option>
                                        <option value="manager1">ফ্যাক্টরি ম্যানেজার ১</option>
                                        <option value="manager2">ফ্যাক্টরি ম্যানেজার ২</option>
                                        <option value="manager3">ফ্যাক্টরি ম্যানেজার ৩</option>
                                        <option value="driver">প্রধান ড্রাইভার (রফিক)</option>
                                        <option value="employee">সাধারণ কর্মচারী</option>
                                    </select>
                                </div>
                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg">
                                    প্রবেশ করুন (Login)
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center">
                        <div>
                            <h1 className="font-bold text-emerald-400">হানিফ ডোর - জাকির লিমিটেড</h1>
                            <p className="text-xs text-slate-400">ব্যবহারকারী: {user.name}</p>
                        </div>
                        <button onClick={handleLogout} className="bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-medium">
                            লগআউট
                        </button>
                    </header>
                    <main className="p-4 flex-1 max-w-7xl w-full mx-auto">
                        <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-2">
                            <h2 className="text-lg font-bold text-emerald-400">ড্যাশবোর্ড সফলভাবে সচল রয়েছে</h2>
                            <p className="text-sm text-slate-400">আপনার সিস্টেম এখন সম্পূর্ণ প্রস্তুত।</p>
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
