<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jakir - ltd | হানিফ ডোর</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .btn { background-color: #059669; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px; }
        .btn-red { background-color: #dc2626; }
        .btn-blue { background-color: #2563eb; }
        .btn-sub { background-color: #334155; color: #cbd5e1; }
        .btn-sub.active { background-color: #059669; color: white; }
        input, select { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 6px; color: white; margin-top: 4px; margin-bottom: 10px; font-size: 14px; }
        .header { background: #1e293b; padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .nav { display: flex; gap: 6px; overflow-x: auto; padding: 10px; background: #0f172a; border-bottom: 1px solid #334155; }
        .nav button { padding: 6px 12px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; white-space: nowrap; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .text-green { color: #34d399; }
        .text-red { color: #f87171; }
        .text-gray { color: #94a3b8; }
        @media print {
            body * { visibility: hidden; }
            #printableMemo, #printableMemo * { visibility: visible; }
            #printableMemo { position: absolute; left: 0; top: 0; width: 100%; background: white; color: black; padding: 20px; }
        }
    </style>
</head>
