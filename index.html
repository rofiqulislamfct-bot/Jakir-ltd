<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হানিফ ডোর - জাকির লিমিটেড</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; background-color: #020617; color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md space-y-4 text-center shadow-2xl">
        <h1 class="text-xl font-bold text-emerald-400">হানিফ ডোর</h1>
        <p class="text-xs text-slate-400">জাকির লিমিটেড ম্যানেজমেন্ট সিস্টেম</p>
        <div class="bg-slate-800 p-4 rounded-xl text-left space-y-2 text-xs">
            <p class="text-emerald-300 font-bold">মালিক ডেমো লগইন:</p>
            <p>• জাকির: 01700000001 (কোড: 7771)</p>
            <p>• হৃদয়: 01700000002 (কোড: 7772)</p>
            <p>• জীবন: 01700000003 (কোড: 7773)</p>
        </div>
        <input type="text" id="phone" placeholder="মোবাইল নম্বর দিন" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white text-center text-sm">
        <input type="password" id="code" placeholder="সিকিউরিটি কোড (যদি মালিক হন)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white text-center text-sm">
        <button onclick="login()" class="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg text-sm">প্রবেশ করুন</button>
    </div>

    <script>
        function login() {
            const p = document.getElementById('phone').value.trim();
            if(p === '01700000001' || p === '01700000002' || p === '01700000003' || p.length === 11) {
                alert('লগইন সফল হয়েছে! সিস্টেম সচল আছে।');
            } else {
                alert('সঠিক মোবাইল নম্বর দিন!');
            }
        }
    </script>
</body>
</html>
