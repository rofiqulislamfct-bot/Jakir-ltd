<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হানিফ ডোর - জাকির লিমিটেড</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .box { background: #1e293b; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 10px; border: 1px solid #334155; }
        input { width: 90%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 5px; }
        button { background: #059669; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 95%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>হানিফ ডোর - জাকির লিমিটেড</h2>
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">ম্যানেজমেন্ট সিস্টেম</p>
        <input type="text" id="phone" placeholder="মোবাইল নম্বর লিখুন">
        <input type="password" id="code" placeholder="সিকিউরিটি কোড">
        <button onclick="alert('সিস্টেম সফলভাবে চালু হয়েছে!')">প্রবেশ করুন</button>
    </div>
</body>
</html>
