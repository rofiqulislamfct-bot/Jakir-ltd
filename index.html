        .notice-card { background: #fef3c7; border: 1px solid #f59e0b; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 12px; color: #92400e; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 5px; }
        th, td { border: 1px solid #cbd5e1; padding: 6px; text-align: left; }
        th { background: #f1f5f9; }
        canvas { border: 1px dashed #94a3b8; background: #fff; width: 100%; height: 120px; border-radius: 5px; margin-top: 5px; }

            const currentHour = new Date().getHours();
            return (currentHour >= 7 && currentHour < 22);

                console.error("Firebase Sync Error:", e);

            localStorage.setItem(localKey, JSON.stringify(data));
            if (db) {
                db.ref(path).set(data).catch((err) => console.error("Cloud Sync Error:", err));
            }
        }
