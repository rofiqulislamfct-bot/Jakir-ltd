<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হানিফ ডোর - জাকির লিমিটেড</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; background-color: #020617; color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex flex-col">
    <div id="app" class="flex-1 flex flex-col"></div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('hanif_user')) || null;
        let staffList = JSON.parse(localStorage.getItem('hanif_staff')) || [
            { id: 1, name: 'জাকির হোসেন', role: 'মালিক', phone: '01700000001', code: '7771', isOwner: true },
            { id: 2, name: 'রফিকুল ইসলাম হৃদয়', role: 'মালিক', phone: '01700000002', code: '7772', isOwner: true },
            { id: 3, name: 'আবু সাকের জীবন', role: 'মালিক', phone: '01700000003', code: '7773', isOwner: true }
        ];

        function render() {
            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md space-y-4 shadow-2xl text-center">
                            <h1 class="text-xl font-bold text-emerald-400">হানিফ ডোর - জাকির লিমিটেড</h1>
                            <p class="text-xs text-slate-400">ম্যানেজমেন্ট সিস্টেম</p>
                            
                            <div class="bg-slate-800 p-3 rounded-xl text-left text-xs space-y-1">
                                <p class="text-emerald-300 font-bold">ডেমো লগইন:</p>
                                <p>• জাকির: 01700000001 (কোড: 7771)</p>
                                <p>• হৃদয়: 01700000002 (কোড: 7772)</p>
                                <p>• জীবন: 01700000003 (কোড: 7773)</p>
                            </div>

                            <div class="space-y-3 pt-2">
                                <input type="text" id="phone" placeholder="মোবাইল নম্বর দিন" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white text-center text-sm">
                                <input type="password" id="code" placeholder="সিকিউরিটি কোড" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white text-center text-sm">
                                <button onclick="login()" class="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg text-sm">প্রবেশ করুন</button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                app.innerHTML = `
                    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center">
                        <h1 class="font-bold text-emerald-400 text-sm">হানিফ ডোর - জাকির লিমিটেড</h1>
                        <button onclick="logout()" class="bg-red-600/20 text-red-400 border border-red-500/30 px-2 py-1 rounded text-xs">লগআউট</button>
                    </header>
                    <main class="p-6 flex-1 max-w-xl w-full mx-auto space-y-4 text-center">
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-2">
                            <h2 class="text-lg font-bold text-emerald-400">স্বাগতম, ${currentUser.name}!</h2>
                            <p class="text-xs text-slate-300">পদবি: ${currentUser.role}</p>
                            <p class="text-xs text-emerald-300 pt-2">সিস্টেম সফলভাবে সচল রয়েছে।</p>
                        </div>
                    </main>
                `;
            }
        }

        function login() {
            const phone = document.getElementById('phone').value.trim();
            const code = document.getElementById('code').value.trim();
            const user = staffList.find(s => s.phone === phone);

            if (user) {
                if (user.code === code) {
                    currentUser = user;
                    localStorage.setItem('hanif_user', JSON.stringify(currentUser));
                    render();
                } else {
                    alert('ভুল সিকিউরিটি কোড!');
                }
            } else {
                alert('নম্বরটি পাওয়া যায়নি!');
            }
        }

        function logout() {
            localStorage.removeItem('hanif_user');
            currentUser = null;
            render();
        }

        render();
    </script>
</body>
</html>
