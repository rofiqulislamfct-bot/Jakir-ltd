<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হানিফ ডোর - জাকির লিমিটেড</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f8fafc; color: #1e293b; padding: 10px; }
        .card { background: white; border: 1px solid #cbd5e1; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .btn { background: #059669; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-red { background: #dc2626; }
        .btn-blue { background: #2563eb; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0 10px 0; border: 1px solid #cbd5e1; border-radius: 5px; }
        .nav { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 10px; }
        .nav button { background: #e2e8f0; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .nav button.active { background: #059669; color: white; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('hanif_user')) || null;
        let staffList = JSON.parse(localStorage.getItem('hanif_staff')) || [
            { id: 1, name: 'জাকির হোসেন', role: 'মালিক', phone: '01700000001', code: '7771', isOwner: true, fine: 0, avatar: '' }
        ];
        let attendanceLogs = JSON.parse(localStorage.getItem('hanif_attendance')) || [];
        let waiverRequests = JSON.parse(localStorage.getItem('hanif_waivers')) || [];
        let currentTab = 'home';

        function render() {
            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = `
                    <div class="card" style="max-width: 400px; margin: 50px auto; text-align: center;">
                        <h2 style="color: #059669; margin-bottom: 5px;">Jakir - ltd</h2>
                        <p style="font-size: 12px; color: #64748b; margin-bottom: 15px;">হানিফ ডোর ম্যানেজমেন্ট সিস্টেম</p>
                        <input type="text" id="phone" placeholder="মোবাইল নম্বর (যেমন: 01700000001)">
                        <input type="password" id="code" placeholder="সিকিউরিটি কোড (মালিক হলে)">
                        <button onclick="login()" class="btn">প্রবেশ করুন</button>
                    </div>
                `;
            } else {
                app.innerHTML = `
                    <div style="background: #0f172a; color: white; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <div>
                            <h3 style="font-size: 14px; color: #34d399;">Jakir - ltd</h3>
                            <p style="font-size: 11px;">${currentUser.name} (${currentUser.role})</p>
                        </div>
                        <button onclick="logout()" class="btn btn-red" style="width: auto; padding: 5px 10px; font-size: 11px;">লগআউট</button>
                    </div>

                    <div class="nav">
                        <button onclick="setTab('home')" class="${currentTab==='home'?'active':''}">হোম</button>
                        <button onclick="setTab('profile')" class="${currentTab==='profile'?'active':''}">👤 প্রোফাইল ও কল</button>
                        <button onclick="setTab('attendance')" class="${currentTab==='attendance'?'active':''}">📍 ক্যামেরা হাজিরা</button>
                        <button onclick="setTab('waiver')" class="${currentTab==='waiver'?'active':''}">⚖️ জরিমানা মওকুফ</button>
                    </div>

                    ${currentTab === 'home' ? `
                        <div class="card">
                            <h3>স্বাগতম, ${currentUser.name}!</h3>
                            <p style="font-size: 12px; color: #64748b; margin-top: 5px;">আপনার সিস্টেম সফলভাবে সচল রয়েছে। ওপরের মেনু থেকে প্রোফাইল ছবি আপলোড, অডিও/ভিডিও কল বা ক্যামেরা দিয়ে হাজিরা দিতে পারবেন।</p>
                        </div>
                    ` : ''}

                    ${currentTab === 'profile' ? `
                        <div class="card">
                            <h3>প্রোফাইল ও যোগাযোগ</h3>
                            <div style="text-align: center; margin: 15px 0;">
                                <div style="width: 70px; height: 70px; background: #e2e8f0; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 30px; overflow: hidden;">
                                    ${currentUser.avatar ? `<img src="${currentUser.avatar}" style="width:100%; height:100%; object-fit:cover;">` : '👤'}
                                </div>
                                <input type="file" accept="image/*" onchange="uploadAvatar(event)" style="margin-top: 10px; font-size: 11px;">
                            </div>
                            <p style="font-size: 13px;"><strong>নাম:</strong> ${currentUser.name}</p>
                            <p style="font-size: 13px;"><strong>ফোন:</strong> ${currentUser.phone}</p>
                            <p style="font-size: 13px;"><strong>জরিমানা:</strong> <span style="color: red;">৳${currentUser.fine || 0}</span></p>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px;">
                                <button onclick="alert('অডিও কল কানেক্ট হচ্ছে...')" class="btn btn-blue">📞 অডিও কল</button>
                                <button onclick="alert('ভিডিও কল শুরু হচ্ছে...')" class="btn" style="background: #7c3aed;">📹 ভিডিও কল</button>
                            </div>
                        </div>
                    ` : ''}

                    ${currentTab === 'attendance' ? `
                        <div class="card">
                            <h3>রিয়েল-টাইম ক্যামেরা ও জিপিএস হাজিরা</h3>
                            <p style="font-size: 12px; color: #64748b; margin-bottom: 10px;">ক্যামেরা দিয়ে ছবি তুলে চেক-ইন বা চেক-আউট দিন।</p>
                            <input type="file" accept="image/*" capture="user" id="attPhoto" style="font-size: 11px;">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px;">
                                <button onclick="recordAttendance('Check-In')" class="btn">🟢 চেক-ইন</button>
                                <button onclick="recordAttendance('Check-Out')" class="btn btn-red">🔴 চেক-আউট</button>
                            </div>
                        </div>
                    ` : ''}

                    ${currentTab === 'waiver' ? `
                        <div class="card">
                            <h3>জরিমানা মওকুফের আবেদন</h3>
                            <textarea id="waiverReason" rows="3" placeholder="মওকুফের কারণ লিখুন..."></textarea>
                            <button onclick="applyWaiver()" class="btn">আবেদন জমা দিন</button>
                        </div>
                    ` : ''}
                `;
            }
        }

        function setTab(t) { currentTab = t; render(); }

        function login() {
            const p = document.getElementById('phone').value.trim();
            const c = document.getElementById('code').value.trim();
            const user = staffList.find(s => s.phone === p);
            if (user) {
                if (user.isOwner && user.code !== c) { alert('ভুল সিকিউরিটি কোড!'); return; }
                currentUser = user;
                localStorage.setItem('hanif_user', JSON.stringify(currentUser));
                render();
            } else { alert('নম্বর পাওয়া যায়নি! ডেমো নম্বর: 01700000001 (কোড: 7771)'); }
        }

        function logout() { localStorage.removeItem('hanif_user'); currentUser = null; render(); }

        function uploadAvatar(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUser.avatar = e.target.result;
                    localStorage.setItem('hanif_user', JSON.stringify(currentUser));
                    render();
                }
                reader.readAsDataURL(file);
            }
        }

        function recordAttendance(type) {
            if (!navigator.geolocation) { alert('লোকেশন সমর্থিত নয়!'); return; }
            navigator.geolocation.getCurrentPosition(position => {
                alert(type + ' সফল হয়েছে! লোকেশন ও ছবি রেকর্ড করা হয়েছে।');
            }, () => { alert('দয়া করে জিপিএস লোকেশন পারমিশন অন করুন!'); });
        }

        function applyWaiver() {
            const reason = document.getElementById('waiverReason').value.trim();
            if(!reason) { alert('কারণ লিখুন!'); return; }
            alert('মওকুফের আবেদন সফলভাবে জমা হয়েছে!');
            render();
        }

        render();
    </script>
</body>
</html>
