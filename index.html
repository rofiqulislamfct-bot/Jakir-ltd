<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হানিফ ডোর - জাকির লিমিটেড</title>
    
    <!-- PWA Web App Manifest Fix -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"JAKIR LTD - Hanif Door","short_name":"HanifDoor","start_url":"./","display":"standalone","background_color":"#0f172a","theme_color":"#10b981","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/5968/5968260.png","sizes":"512x512","type":"image/png"}]}'>
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        darkBg: '#0F172A',
                        cardBg: '#1E293B'
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <!-- Working Service Worker for PWA Install -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('data:text/javascript;base64,' + btoa(`
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => e.claim());
                    self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => new Response('Offline'))); });
                `)).catch(() => {});
            });
        }
    </script>

    <script type="text/babel">
        function App() {
            const [user, setUser] = React.useState(null);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (email.toLowerCase().includes('owner') || email === 'zakir@jakirltd.com') {
                    setUser({ name: 'জাকির হোসেন (Chairman / Owner)', role: 'owner' });
                } else if (email.toLowerCase().includes('manager')) {
                    setUser({ name: 'ফ্যাক্টরি ম্যানেজার', role: 'manager' });
                } else if (email.toLowerCase().includes('driver')) {
                    setUser({ name: 'ডেলিভারি ড্রাইভার', role: 'driver' });
                } else {
                    setUser({ name: 'সাধারণ কর্মচারী', role: 'employee' });
                }
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
                            <div className="text-center mb-8">
                                <h1 className="text-2xl font-bold text-emerald-400">হানিফ ডোর</h1>
                                <p className="text-sm text-slate-400 mt-1">জাকির লিমিটেড ম্যানেজমেন্ট সিস্টেম</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">ইমেইল বা ইউজার আইডি</label>
                                    <input 
                                        type="text" required placeholder="owner@jakirltd.com বা manager@..." 
                                        value={email} onChange={(e) => setEmail(e.target.value)}
                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">পাসওয়ার্ড</label>
                                    <input 
                                        type="password" required placeholder="••••••••" 
                                        value={password} onChange={(e) => setPassword(e.target.value)}
                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500"
                                    />
                                </div>
                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg">
                                    লগইন করুন
                                </button>
                                <p className="text-xs text-center text-slate-500 mt-4">
                                    টিপস: Owner হিসেবে ঢুকতে ইমেইলে 'owner' লিখে লগইন করুন।
                                </p>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center">
                        <div>
                            <h1 className="font-bold text-emerald-400">হানিফ ডোর - জাকির লিমিটেড</h1>
                            <p className="text-xs text-slate-400">ব্যবহারকারী: {user.name} ({user.role.toUpperCase()})</p>
                        </div>
                        <button onClick={() => setUser(null)} className="bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-medium">
                            লগআউট
                        </button>
                    </header>
                    <main className="p-4 flex-1 max-w-7xl w-full mx-auto">
                        <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                            <h2 className="text-lg font-bold mb-2 text-emerald-400">ড্যাশবোর্ড সফলভাবে সচল রয়েছে</h2>
                            <p className="text-sm text-slate-400">এখন ব্রাউজার মেনু থেকে সরাসরি অ্যাপটি ইনস্টল (Install app) করতে পারবেন।</p>
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
