<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হানিফ ডোর - জাকির লিমিটেড</title>
    
    <!-- Firebase SDK (Modular v9/v10 CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f8fafc; color: #1e293b; padding: 10px; }
        .card { background: white; border: 1px solid #cbd5e1; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .btn { background: #059669; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-red { background: #dc2626; }
        .btn-blue { background: #2563eb; }
        .btn-sub { background: #e2e8f0; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; font-size: 12px; cursor: pointer; position: relative; white-space: nowrap; }
        .btn-sub.active { background: #059669; color: white; }
        .badge { background: #dc2626; color: white; border-radius: 50%; padding: 2px 6px; font-size: 11px; position: absolute; top: -5px; right: -5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin: 4px 0 8px 0; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; }
        .nav { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 10px; }
        .notif-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 12px; color: #1e40af; display: flex; justify-content: space-between; align-items: center; }
        .notice-card { background: #fef3c7; border: 1px solid #f59e0b; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 12px; color: #92400e; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 5px; }
        th, td { border: 1px solid #cbd5e1; padding: 6px; text-align: left; }
        th { background: #f1f5f9; }
    </style>
</head>
<body>
    <div id="app">
        <div style="text-align:center; margin-top:50px;">
            <h3>সিস্টেম লোড হচ্ছে...</h3>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAfcJ8Jhn0éb-Bx_3dhI4TheIt8ppRE8S4",
            authDomain: "jakir-ltd.firebaseapp.com",
            databaseURL: "https://jakir-ltd-default-rtdb.firebaseio.com",
            projectId: "jakir-ltd",
            storageBucket: "jakir-ltd.appspot.com",
            messagingSenderId: "235034327378",
            appId: "1:235034327378:web:a3233b7fe27a2f9436a28b"
        };

        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch (e) {
            console.log("Firebase Init Failed");
        }

        let currentUser = JSON.parse(localStorage.getItem('hanif_user')) || null;
        let staffList = JSON.parse(localStorage.getItem('hanif_staff')) || [
            { id: 1, name: 'জাকির হোসেন', role: 'প্রধান মালিক', phone: '01700000001', code: '7771', isOwner: true, status: 'Active', salary: 0, tiffin: 0, advance: 0 }
        ];
        let attendanceLogs = JSON.parse(localStorage.getItem('hanif_attendance')) || [];
        let notices = JSON.parse(localStorage.getItem('hanif_notices')) || [
            { id: 1, text: 'হানিফ ডোর - জাকির লিমিটেডের লাইভ পোর্টালে সবাইকে স্বাগতম!', date: 'আজ' }
        ];
        let inventory = JSON.parse(localStorage.getItem('hanif_inventory')) || [
            { id: 1, name: 'প্লাস্টিক ডোর (মডেল এ)', stock: 25, price: 3500 },
            { id: 2, name: 'কাঠের ফিনিশ ডোর', stock: 12, price: 6000 }
        ];

        let authTab = 'login';
        let currentTab = 'home';

        // রিয়েল-টাইম ডাটা সিঙ্ক
        function initRealtimeSync() {
            if (!db) {
                render();
                return;
            }

            db.ref('staffList').on('value', (snapshot) => {
                if (snapshot.exists()) {
                    staffList = snapshot.val();
                    localStorage.setItem('hanif_staff', JSON.stringify(staffList));
                } else {
                    db.ref('staffList').set(staffList);
                }
                render();
            }, (error) => {
                render();
            });

            db.ref('attendanceLogs').on('value', (snapshot) => {
                if (snapshot.exists()) {
                    attendanceLogs = snapshot.val();
                    localStorage.setItem('hanif_attendance', JSON.stringify(attendanceLogs));
                    render();
                }
            });

            db.ref('notices').on('value', (snapshot) => {
                if (snapshot.exists()) {
                    notices = snapshot.val();
                    localStorage.setItem('hanif_notices', JSON.stringify(notices));
                    render();
                }
            });

            db.ref('inventory').on('value', (snapshot) => {
                if (snapshot.exists()) {
                    inventory = snapshot.val();
                    localStorage.setItem('hanif_inventory', JSON.stringify(inventory));
                    render();
                }
            });
        }

        function syncData(path, data) {
            if (db) {
                db.ref(path).set(data);
            }
        }

        function render() {
            const app = document.getElementById('app');
            const pendingStaffs = staffList.filter(s => s.status === 'Pending');
            const pendingCount = pendingStaffs.length;

            if (!currentUser) {
                app.innerHTML = `
                    <div class="card" style="max-width: 400px; margin: 30px auto;">
                        <h2 style="color: #059669; text-align: center; margin-bottom: 5px;">Jakir - ltd</h2>
                        <p style="font-size: 12px; color: #64748b; text-align: center; margin-bottom: 15px;">হানিফ ডোর ম্যানেজমেন্ট সিস্টেম</p>

                        <div style="display: flex; gap: 5px; margin-bottom: 15px;">
                            <button onclick="setAuthTab('login')" class="btn-sub" style="flex:1; ${authTab==='login'?'background:#059669;color:white;':''}">লগইন</button>
                            <button onclick="setAuthTab('register')" class="btn-sub" style="flex:1; ${authTab==='register'?'background:#059669;color:white;':''}">কর্মী রেজিস্ট্রেশন</button>
                        </div>

                        ${authTab === 'login' ? `
                            <label style="font-size: 12px; font-weight: bold;">মোবাইল নম্বর</label>
                            <input type="text" id="loginPhone" placeholder="017xxxxxxxx">
                            <label style="font-size: 12px; font-weight: bold;">সিকিউরিটি কোড (শুধু মালিকের জন্য)</label>
                            <input type="password" id="loginCode" placeholder="কোড দিন">
                            <button onclick="login()" class="btn">প্রবেশ করুন</button>
                            <div style="font-size: 11px; color: #64748b; margin-top: 10px; background: #f1f5f9; padding: 8px; border-radius: 5px;">
                                <strong>মালিক ডেমো নম্বর:</strong> 01700000001 (কোড: 7771)
                            </div>
                        ` : `
                            <div>
                                <label style="font-size: 12px; font-weight: bold;">আপনার পূর্ণ নাম</label>
                                <input type="text" id="regName" placeholder="নাম লিখুন">
                                <label style="font-size: 12px; font-weight: bold;">মোবাইল নম্বর</label>
                                <input type="text" id="regPhone" placeholder="017xxxxxxxx">
                                <button onclick="registerStaff()" class="btn">রেজিস্ট্রেশনের আবেদন পাঠান</button>
                            </div>
                        `}
                    </div>
                `;
            } else {
                app.innerHTML = `
                    <div style="background: #0f172a; color: white; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <div>
                            <h3 style="font-size: 14px; color: #34d399;">Jakir - ltd</h3>
                            <p style="font-size: 11px;">${currentUser.name} (${currentUser.role})</p>
                        </div>
                        <button onclick="logout()" class="btn btn-red" style="width: auto; padding: 5px 10px; font-size: 11px;">লগআউট</button>
                    </div>

                    ${currentUser.isOwner && pendingCount > 0 ? `
                        <div class="notif-box">
                            <span>🔔 নতুন কর্মীর <strong>${pendingCount}টি</strong> অনুমোদনের আবেদন এসেছে!</span>
                            <button onclick="setTab('owner')" class="btn-sub" style="background:#2563eb; color:white; padding:4px 8px;">দেখুন</button>
                        </div>
                    ` : ''}

                    <div class="nav">
                        <button onclick="setTab('home')" class="btn-sub ${currentTab==='home'?'active':''}">হোম</button>
                        <button onclick="setTab('profile')" class="btn-sub ${currentTab==='profile'?'active':''}">👤 প্রোফাইল</button>
                        <button onclick="setTab('attendance')" class="btn-sub ${currentTab==='attendance'?'active':''}">📍 হাজিরা</button>
                        <button onclick="setTab('inventory')" class="btn-sub ${currentTab==='inventory'?'active':''}">📦 স্টক</button>
                        ${currentUser.isOwner ? `
                            <button onclick="setTab('owner')" class="btn-sub ${currentTab==='owner'?'active':''}" style="position:relative;">
                                👑 পে-রোল ও রিপোর্ট
                                ${pendingCount > 0 ? `<span class="badge">${pendingCount}</span>` : ''}
                            </button>
                        ` : ''}
                    </div>

                    ${currentTab === 'home' ? `
                        <div>
                            ${notices.map(n => `
                                <div class="notice-card">
                                    <strong>📢 নোটিশ:</strong> ${n.text} <span style="font-size: 10px; color: #b45309; float: right;">${n.date}</span>
                                </div>
                            `).join('')}

                            <div class="card">
                                <h3>স্বাগতম, ${currentUser.name}!</h3>
                                <p style="font-size: 12px; color: #64748b; margin-top: 5px;">হানিফ ডোর ম্যানেজমেন্ট সিস্টেম লাইভ ক্লাউড মোডে সচল রয়েছে।</p>
                            </div>
                        </div>
                    ` : ''}

                    ${currentTab === 'profile' ? `
                        <div class="card">
                            <h3>আপনার প্রোফাইল ও আর্থিক বিবরণী</h3>
                            <p style="font-size: 13px; margin-top: 5px;"><strong>নাম:</strong> ${currentUser.name}</p>
                            <p style="font-size: 13px; margin-top: 3px;"><strong>পদবি:</strong> ${currentUser.role}</p>
                            <p style="font-size: 13px; margin-top: 3px;"><strong>মোবাইল:</strong> ${currentUser.phone}</p>
                            <p style="font-size: 13px; margin-top: 3px;"><strong>মাসিক বেতন:</strong> ৳${currentUser.salary || 0}</p>
                            <p style="font-size: 13px; margin-top: 3px;"><strong>অগ্রিম লোন গৃহিত:</strong> ৳${currentUser.advance || 0}</p>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px;">
                                <a href="tel:${currentUser.phone}" class="btn btn-blue" style="text-align:center; text-decoration:none; padding: 10px; display:inline-block;">📞 কল করুন</a>
                                <a href="https://wa.me/" target="_blank" class="btn" style="background: #25d366; text-align:center; text-decoration:none; padding: 10px; display:inline-block;">💬 ওয়াটসঅ্যাপ</a>
                            </div>
                        </div>
                    ` : ''}

                    ${currentTab === 'attendance' ? `
                        <div class="card">
                            <h3>রিয়েল-টাইম জিপিএস ক্যামেরা হাজিরা</h3>
                            <input type="file" accept="image/*" capture="user" id="attPhoto" style="font-size: 11px;">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px;">
                                <button onclick="recordAttendance('Check-In')" class="btn">🟢 চেক-ইন</button>
                                <button onclick="recordAttendance('Check-Out')" class="btn btn-red">🔴 চেক-আউট</button>
                            </div>
                        </div>
                    ` : ''}

                    ${currentTab === 'inventory' ? `
                        <div class="card">
                            <h3 style="color: #059669; margin-bottom: 10px;">📦 স্টক ও ইনভেন্টরি</h3>
                            ${currentUser.isOwner ? `
                                <div style="background: #f1f5f9; padding: 8px; border-radius: 5px; margin-bottom: 10px;">
                                    <input type="text" id="invName" placeholder="পণ্যের নাম">
                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                                        <input type="number" id="invStock" placeholder="পরিমাণ (স্টক)">
                                        <input type="number" id="invPrice" placeholder="মূল্য ৳">
                                    </div>
                                    <button onclick="addInventory()" class="btn" style="padding: 6px;">নতুন পণ্য যোগ করুন</button>
                                </div>
                            ` : ''}
                            <table>
                                <tr>
                                    <th>পণ্যের নাম</th>
                                    <th>স্টক</th>
                                    <th>মূল্য</th>
                                </tr>
                                ${inventory.map(i => `
                                    <tr>
                                        <td>${i.name}</td>
                                        <td>${i.stock} পিস</td>
                                        <td>৳${i.price}</td>
                                    </tr>
                                `).join('')}
                            </table>
                        </div>
                    ` : ''}

                    ${currentUser.isOwner && currentTab === 'owner' ? `
                        <div class="card">
                            <h3 style="color: #059669; margin-bottom: 10px;">📢 নতুন নোটিশ প্রকাশ করুন</h3>
                            <textarea id="noticeText" rows="2" placeholder="সকলের উদ্দেশ্যে নোটিশ লিখুন..."></textarea>
                            <button onclick="postNotice()" class="btn" style="margin-bottom: 15px; padding: 6px;">নোটিশ পোস্ট করুন</button>

                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h3 style="color: #059669;">👑 পে-রোল ও কর্মী ম্যানেজমেন্ট</h3>
                                <button onclick="exportToCSV()" class="btn btn-blue" style="width: auto; padding: 6px 12px; font-size: 11px;">📥 রিপোর্ট ডাউনলোড (Excel)</button>
                            </div>
                            
                            ${staffList.map(s => {
                                const userLogs = attendanceLogs.filter(l => l.phone === s.phone);
                                const totalDays = userLogs.filter(l => l.type === 'Check-In').length;
                                const baseCalc = totalDays * (s.salary ? Math.round(s.salary/30) : 0);
                                const netPayable = (baseCalc + (totalDays * (s.tiffin || 0))) - (s.advance || 0);

                                return `
                                    <div style="background: #f1f5f9; padding: 12px; border-radius: 6px; margin-top: 8px; font-size: 12px; border-left: 4px solid ${s.status==='Pending'?'#dc2626':'#059669'};">
                                        <p><strong>নাম:</strong> ${s.name} | ফোন: ${s.phone}</p>
                                        <p><strong>পদবি:</strong> ${s.role} | উপস্থিতি: ${totalDays} দিন</p>
                                        <p><strong>প্রাক্কলিত পাওনা (বেতন+নাস্তা - লোন):</strong> <span style="color: #059669; font-weight: bold;">৳${netPayable > 0 ? netPayable : 0}</span></p>
                                        
                                        <div style="margin-top: 8px; display: flex; gap: 5px;">
                                            <input type="number" id="adv_${s.id}" placeholder="অগ্রিম লোন দিন ৳" style="margin:0; font-size:11px;">
                                            <button onclick="giveAdvance(${s.id})" class="btn-sub" style="background:#2563eb; color:white;">লোন প্রদান</button>
                                        </div>

                                        ${s.status === 'Pending' ? `
                                            <div style="margin-top: 10px; background: #fff; padding: 8px; border-radius: 5px; border: 1px solid #cbd5e1;">
                                                <input type="text" id="role_${s.id}" placeholder="পদবি (যেমন: ম্যানেজার)">
                                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                                                    <input type="number" id="sal_${s.id}" placeholder="মাসিক বেতন ৳">
                                                    <input type="number" id="tif_${s.id}" placeholder="নাস্তা বিল ৳">
                                                </div>
                                                <button onclick="approveStaff(${s.id})" class="btn" style="margin-top: 5px; padding: 8px;">✅ অনুমোদন ও পে-রোল সেট করুন</button>
                                            </div>
                                        ` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    ` : ''}
                `;
            }
        }

        function setAuthTab(t) { authTab = t; render(); }
        function setTab(t) { currentTab = t; render(); }

        function login() {
            const phone = document.getElementById('loginPhone').value.trim();
            const code = document.getElementById('loginCode').value.trim();
            const user = staffList.find(s => s.phone === phone);

            if (!user) { alert('এই নম্বরে কোনো অ্যাকাউন্ট পাওয়া যায়নি!'); return; }
            if (user.status === 'Pending') { alert('আপনার অ্যাকাউন্টটি এখনও মালিকের অনুমোদনের অপেক্ষায় রয়েছে!'); return; }
            if (user.isOwner && user.code !== code) { alert('ভুল সিকিউরিটি কোড!'); return; }

            currentUser = user;
            localStorage.setItem('hanif_user', JSON.stringify(currentUser));
            render();
        }

        function registerStaff() {
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();

            if (!name || phone.length !== 11) { alert('সঠিক নাম ও ১১ ডিজিটের মোবাইল নম্বর দিন!'); return; }
            if (staffList.some(s => s.phone === phone)) { alert('এই নম্বর দিয়ে আগেই আবেদন করা হয়েছে!'); return; }

            staffList.push({
                id: Date.now(),
                name: name,
                role: 'অপেক্ষমাণ কর্মী',
                phone: phone,
                code: '',
                isOwner: false,
                status: 'Pending',
                salary: 0,
                tiffin: 0,
                advance: 0
            });

            syncData('staffList', staffList);
            alert('রেজিস্ট্রেশনের আবেদন সফলভাবে জমা হয়েছে!');
            setAuthTab('login');
        }

        function approveStaff(id) {
            const roleInput = document.getElementById(`role_${id}`).value.trim() || 'কর্মী';
            const salInput = Number(document.getElementById(`sal_${id}`).value) || 0;
            const tifInput = Number(document.getElementById(`tif_${id}`).value) || 0;

            staffList = staffList.map(s => s.id === id ? {...s, status: 'Active', role: roleInput, salary: salInput, tiffin: tifInput} : s);
            syncData('staffList', staffList);
            alert('কর্মী সফলভাবে অনুমোদিত হয়েছে!');
        }

        function giveAdvance(id) {
            const amt = Number(document.getElementById(`adv_${id}`).value) || 0;
            if (amt <= 0) { alert('সঠিক পরিমাণ টাকা লিখুন!'); return; }

            staffList = staffList.map(s => s.id === id ? {...s, advance: (s.advance || 0) + amt} : s);
            syncData('staffList', staffList);
            alert('অগ্রিম লোন সফলভাবে যুক্ত করা হয়েছে!');
        }

        function addInventory() {
            const name = document.getElementById('invName').value.trim();
            const stock = Number(document.getElementById('invStock').value) || 0;
            const price = Number(document.getElementById('invPrice').value) || 0;

            if (!name) { alert('পণ্যের নাম দিন!'); return; }
            inventory.push({ id: Date.now(), name, stock, price });
            syncData('inventory', inventory);
            alert('নতুন পণ্য স্টকে যুক্ত হয়েছে!');
        }

        function postNotice() {
            const text = document.getElementById('noticeText').value.trim();
            if (!text) { alert('নোটিশের লেখা লিখুন!'); return; }
            
            notices.unshift({ id: Date.now(), text: text, date: new Date().toLocaleDateString('bn-BD') });
            syncData('notices', notices);
            alert('নোটিশ প্রকাশিত হয়েছে!');
        }

        function exportToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,ID,Name,Phone,Role,Salary,Advance\n";
            staffList.forEach(s => {
                csvContent += `${s.id},${s.name},${s.phone},${s.role},${s.salary},${s.advance || 0}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "hanif_door_payroll_report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function logout() { localStorage.removeItem('hanif_user'); currentUser = null; render(); }

        function recordAttendance(type) {
            if (!navigator.geolocation) { alert('লোকেশন সমর্থিত নয়!'); return; }
            navigator.geolocation.getCurrentPosition((pos) => {
                const now = new Date().toLocaleString('bn-BD');
                attendanceLogs.push({
                    name: currentUser.name,
                    phone: currentUser.phone,
                    type: type,
                    time: now
                });
                syncData('attendanceLogs', attendanceLogs);
                alert(type + ' সফল হয়েছে!');
            }, () => { alert('দয়া করে জিপিএস লোকেশন পারমিশন অন করুন!'); });
        }

        initRealtimeSync();
    </script>
</body>
</html>
