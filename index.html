<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হানিফ ডোর - জাকির লিমিটেড</title>
    
    <!-- PWA Manifest & Settings -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"JAKIR LTD - Hanif Door","short_name":"JAKIR LTD","start_url":"./","display":"standalone","background_color":"#0f172a","theme_color":"#10b981","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/5968/5968260.png","sizes":"512x512","type":"image/png"}]}'>
    <meta name="theme-color" content="#10b981">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        darkBg: '#0F172A',
                        cardBg: '#1E293B'
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printable-challan, #printable-challan * { visibility: visible; }
            #printable-challan { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; padding: 20px; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [user, setUser] = React.useState(null);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('dashboard');
            
            // Orders State
            const [orders, setOrders] = React.useState([
                { id: 'MEMO-1001', customer: 'আলমগীর হোসেন', phone: '01711000000', address: 'মিরপুর, ঢাকা', product: 'হানিফ সেগুন ডোর (39"x84")', qty: 4, total: 48000, advance: 10000, due: 38000, status: 'প্রোডাকশনে আছে' }
            ]);

            // New Order Form State
            const [newOrder, setNewOrder] = React.useState({ customer: '', phone: '', address: '', product: '', qty: 1, price: 0, advance: 0 });
            const [selectedChallan, setSelectedChallan] = React.useState(null);

            // Production State (Manager Module)
            const [productionLogs, setProductionLogs] = React.useState([
                { id: 1, date: '২০২৬-১১-০৩', item: 'হানিফ পলিমার ডোর', qty: 40, status: 'মানসম্মত ও স্টকভুক্ত' }
            ]);
            const [newProd, setNewProd] = React.useState({ item: 'হানিফ পলিমার ডোর', qty: '', note: '' });

            // Attendance & Penalty Waiver State (Owner Approval)
            const [attendance, setAttendance] = React.useState([
                { id: 1, name: 'কামাল হোসেন', time: '09:15 AM', status: 'লেট ৩০ মিনিট', penalty: '৫০% স্ন্যাক্স কর্তন', approval: 'Pending' }
            ]);

            // Finance State
            const [finances, setFinances] = React.useState({
                cashSales: 35000,
                bkashBank: 15000,
                expenses: 4200
            });

            const handleLogin = (e) => {
                e.preventDefault();
                const lowerEmail = email.toLowerCase();
                if (lowerEmail.includes('owner') || lowerEmail === 'zakir@jakirltd.com') {
                    setUser({ name: 'জাকির হোসেন (Chairman / Owner)', role: 'owner' });
                } else if (lowerEmail.includes('manager')) {
                    setUser({ name: 'ফ্যাক্টরি ম্যানেজার', role: 'manager' });
                } else if (lowerEmail.includes('driver')) {
                    setUser({ name: 'ডেলিভারি ড্রাইভার', role: 'driver' });
                } else {
                    setUser({ name: 'সাধারণ কর্মচারী', role: 'employee' });
                }
            };

            const handleCreateOrder = (e) => {
                e.preventDefault();
                const total = newOrder.qty * newOrder.price;
                const due = total - newOrder.advance;
                const orderObj = {
                    id: `MEMO-${1000 + orders.length + 1}`,
                    customer: newOrder.customer,
                    phone: newOrder.phone,
                    address: newOrder.address,
                    product: newOrder.product,
                    qty: newOrder.qty,
                    total: total,
                    advance: newOrder.advance,
                    due: due,
                    status: 'প্রোডাকশনে আছে'
                };
                setOrders([...orders, orderObj]);
                setNewOrder({ customer: '', phone: '', address: '', product: '', qty: 1, price: 0, advance: 0 });
                alert('নতুন মেমো সফলভাবে তৈরি হয়েছে!');
            };

            const handleAddProduction = (e) => {
                e.preventDefault();
                if(!newProd.qty) return;
                setProductionLogs([...productionLogs, {
                    id: productionLogs.length + 1,
                    date: new Date().toLocaleDateString('bn-BD'),
                    item: newProd.item,
                    qty: Number(newProd.qty),
                    status: 'ম্যানেজার কর্তৃক এন্ট্রি কৃত'
                }]);
                setNewProd({ item: 'হানিফ পলিমার ডোর', qty: '', note: '' });
                alert('প্রোডাকশন স্টক সফলভাবে আপডেট হয়েছে!');
            };

            const handleApproval = (id, status) => {
                setAttendance(attendance.map(item => item.id === id ? {...item, approval: status} : item));
            };

            const handlePrint = (order) => {
                setSelectedChallan(order);
                setTimeout(() => { window.print(); }, 300);
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
                            <div className="text-center mb-8">
                                <h1 className="text-2xl font-bold text-emerald-400">হানিফ ডোর</h1>
                                <p className="text-sm text-slate-400 mt-1">জাকির লিমিটেড ম্যানেজমেন্ট সিস্টেম</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">ইমেইল বা ইউজার আইডি</label>
                                    <input 
                                        type="text" required placeholder="owner@jakirltd.com বা manager@..." 
                                        value={email} onChange={(e) => setEmail(e.target.value)}
                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">পাসওয়ার্ড</label>
                                    <input 
                                        type="password" required placeholder="••••••••" 
                                        value={password} onChange={(e) => setPassword(e.target.value)}
                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500"
                                    />
                                </div>
                                <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg">
                                    লগইন করুন
                                </button>
                                <p className="text-xs text-center text-slate-500 mt-4">
                                    টিপস: Owner হিসেবে ঢুকতে ইমেইলে 'owner' লিখে লগইন করুন।
                                </p>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center sticky top-0 z-50">
                        <div>
                            <h1 className="font-bold text-emerald-400">হানিফ ডোর - জাকির লিমিটেড</h1>
                            <p className="text-xs text-slate-400">ব্যবহারকারী: {user.name} ({user.role.toUpperCase()})</p>
                        </div>
                        <button onClick={() => setUser(null)} className="bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-medium">
                            লগআউট
                        </button>
                    </header>

                    {/* Navigation Tabs */}
                    <nav className="bg-slate-900/50 border-b border-slate-800 px-4 py-2 flex gap-2 overflow-x-auto text-sm">
                        <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-1.5 rounded-lg whitespace-nowrap ${activeTab === 'dashboard' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>ড্যাশবোর্ড</button>
                        <button onClick={() => setActiveTab('production')} className={`px-3 py-1.5 rounded-lg whitespace-nowrap ${activeTab === 'production' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>ম্যানেজার ও প্রোডাকশন</button>
                        <button onClick={() => setActiveTab('orders')} className={`px-3 py-1.5 rounded-lg whitespace-nowrap ${activeTab === 'orders' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>মেমো ও অর্ডার</button>
                        <button onClick={() => setActiveTab('attendance')} className={`px-3 py-1.5 rounded-lg whitespace-nowrap ${activeTab === 'attendance' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>উপস্থিতি ও ওনার অ্যাপ্রুভাল</button>
                        <button onClick={() => setActiveTab('driver')} className={`px-3 py-1.5 rounded-lg whitespace-nowrap ${activeTab === 'driver' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>ড্রাইভার ও GPS</button>
                        <button onClick={() => setActiveTab('finance')} className={`px-3 py-1.5 rounded-lg whitespace-nowrap ${activeTab === 'finance' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>আর্থিক হিসাব</button>
                    </nav>

                    <main className="p-4 flex-1 max-w-7xl w-full mx-auto space-y-4">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                        <p className="text-xs text-slate-400">মোট অর্ডার</p>
                                        <h3 className="text-xl font-bold text-emerald-400 mt-1">{orders.length} টি</h3>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                        <p className="text-xs text-slate-400">আজকের ক্যাশ সেলস</p>
                                        <h3 className="text-xl font-bold text-emerald-400 mt-1">৳ {finances.cashSales}</h3>
                                    </div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl space-y-2">
                                    <h2 className="text-lg font-bold text-emerald-400">হানিফ ডোর ম্যানেজমেন্ট প্যানেল</h2>
                                    <p className="text-sm text-slate-400">এখানে তিন সমান ক্ষমতার মালিক (জাকির হোসেন, রফিকুল ইসলাম হৃদয়, আবু সাকের জীবন) যৌথভাবে কারখানা পরিচালনা করছেন। জাকির ইলেকট্রনিক্স সম্পূর্ণ বাদ দিয়ে অ্যাপটি শুধুমাত্র হানিফ ডোর ইউনিটের জন্য তৈরি।</p>
