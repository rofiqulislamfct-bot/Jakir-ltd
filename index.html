<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হানিফ ডোর - জাকির লিমিটেড</title>
    
    <!-- Inline Web App Manifest (PWA Download Support) -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"JAKIR LTD - Hanif Door","short_name":"JAKIR LTD","start_url":"./","display":"standalone","background_color":"#0f172a","theme_color":"#10b981","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/5968/5968260.png","sizes":"512x512","type":"image/png"}]}'>
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981',
                        darkBg: '#0F172A',
                        cardBg: '#1E293B'
                    }
                }
            }
        }
    </script>
    <!-- React & Babel CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <!-- Register Service Worker for PWA Installation -->
    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => {
                    self.skipWaiting();
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => new Response('Offline')));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(() => {});
        }
    </script>

    <!-- React Application Logic -->
    <script type="text/babel">
        function App() {
            const [user, setUser] = React.useState(null);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('dashboard');

            const handleLogin = (e) => {
                e.preventDefault();
                if (email.includes('owner') || email === 'zakir@jakirltd.com') {
                    setUser({ name: 'জাকির হোসেন (Chairman / Owner)', role: 'owner' });
                } else if (email.includes('manager')) {
                    setUser({ name: 'ফ্যাক্টরি ম্যানেজার', role: 'manager' });
                } else if (email.includes('driver')) {
                    setUser({ name: 'ডেলিভারি ড্রাইভার', role: 'driver' });
                } else {
                    setUser({ name: 'সাধারণ কর্মচারী', role: 'employee' });
                }
            };

            const handleLogout = () => {
                setUser(null);
                setEmail('');
                setPassword('');
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
                        <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
                            <div className="text-center mb-8">
                                <h1 className="text-2xl font-bold text-emerald-400">হানিফ ডোর</h1>
                                <p className="text-sm text-slate-400 mt-1">জাকির লিমিটেড ম্যানেজমেন্ট সিস্টেম</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">ইমেইল বা ইউজার আইডি</label>
                                    <input 
                                        type="text" 
                                        required
                                        placeholder="owner@jakirltd.com বা manager@..." 
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">পাসওয়ার্ড</label>
                                    <input 
                                        type="password" 
                                        required
                                        placeholder="••••••••" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500"
                                    />
                                </div>
                                <button 
                                    type="submit"
                                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-emerald-900/40"
                                >
                                    লগইন করুন
                                </button>
                                <p className="text-xs text-center text-slate-500 mt-4">
                                    টিপস: Owner হিসেবে ঢুকতে ইমেইলে 'owner' লিখে লগইন করুন।
                                </p>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    <header className="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center">
                        <div>
                            <h1 className="font-bold text-emerald-400">হানিফ ডোর - জাকির লিমিটেড</h1>
                            <p className="text-xs text-slate-400">ব্যবহারকারী: {user.name} ({user.role.toUpperCase()})</p>
                        </div>
                        <button 
                            onClick={handleLogout}
                            className="bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-red-600 hover:text-white transition"
                        >
                            লগআউট
                        </button>
                    </header>

                    <nav className="bg-slate-900/50 border-b border-slate-800 px-4 py-2 flex gap-2 overflow-x-auto text-sm">
                        <button 
                            onClick={() => setActiveTab('dashboard')}
                            className={`px-3 py-1.5 rounded-lg whitespace-nowrap ${activeTab === 'dashboard' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                        >
                            ড্যাশবোর্ড
                        </button>
                        <button 
                            onClick={() => setActiveTab('production')}
                            className={`px-3 py-1.5 rounded-lg whitespace-nowrap ${activeTab === 'production' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                        >
                            প্রোডাকশন ও স্টক
                        </button>
                        <button 
                            onClick={() => setActiveTab('orders')}
                            className={`px-3 py-1.5 rounded-lg whitespace-nowrap ${activeTab === 'orders' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                        >
                            অর্ডার ও চালান
                        </button>
                        <button 
                            onClick={() => setActiveTab('attendance')}
                            className={`px-3 py-1.5 rounded-lg whitespace-nowrap ${activeTab === 'attendance' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                        >
                            উপস্থিতি ও পেনাল্টি
                        </button>
                    </nav>

                    <main className="p-4 flex-1 max-w-7xl w-full mx-auto space-y-4">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                        <p className="text-xs text-slate-400">মোট কর্মচারী</p>
                                        <h3 className="text-xl font-bold text-emerald-400 mt-1">২৫ জন</h3>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                        <p className="text-xs text-slate-400">আজকের প্রোডাকশন</p>
                                        <h3 className="text-xl font-bold text-emerald-400 mt-1">৪০ পিস ডোর</h3>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                        <p className="text-xs text-slate-400">সক্রিয় অর্ডার</p>
                                        <h3 className="text-xl font-bold text-emerald-400 mt-1">১২ টি</h3>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                        <p className="text-xs text-slate-400">আজকের সেলস</p>
                                        <h3 className="text-xl font-bold text-emerald-400 mt-1">৳ ১,২০,০০০</h3>
                                    </div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                    <h2 className="text-lg font-bold mb-2">হানিফ ডোর ম্যানেজমেন্ট প্যানেল</h2>
                                    <p className="text-sm text-slate-400">
                                        এখানে তিন মালিক (জাকির হোসেন, রফিকুল ইসলাম হৃদয়, আবু সাকের জীবন) যৌথভাবে সমান প্রশাসনিক ক্ষমতায় কারখানা পরিচালনা করছেন। জাকির ইলেকট্রনিক্স ইউনিটটি এই সিস্টেম থেকে বাদ দেওয়া হয়েছে।
                                    </p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'production' && (
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                <h2 className="text-lg font-bold mb-4">হানিফ ডোর প্রোডাকশন লগ</h2>
                                <p className="text-sm text-slate-400">দৈনিক তৈরি দরজার হিসাব, মান নিয়ন্ত্রণ এবং ম্যানেজারের রিপোর্টের তালিকা এখানে সংরক্ষিত হবে।</p>
                            </div>
                        )}

                        {activeTab === 'orders' && (
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                <h2 className="text-lg font-bold mb-4">ডিজিটাল মেমো ও চালান</h2>
                                <p className="text-sm text-slate-400">গ্রাহকের নাম, ঠিকানা, অ্যাডভান্স পেমেন্ট এবং প্রিন্টযোগ্য ডেলিভারি চালানের তথ্য।</p>
                            </div>
                        )}

                        {activeTab === 'attendance' && (
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                                <h2 className="text-lg font-bold mb-4">উপস্থিতি ও পেনাল্টি রুলস</h2>
                                <p className="text-sm text-slate-400">৩০ মিনিট বা ১ ঘণ্টা দেরির জন্য স্ন্যাক্স এলাউন্স কাটা এবং সাপ্তাহিক ছুটির পেনাল্টি অ্যাপ্রুভাল মডিউল।</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
