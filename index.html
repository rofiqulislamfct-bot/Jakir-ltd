<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হানিফ ডোর - জাকির লিমিটেড</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; background-color: #020617; color: #f8fafc; }</style>
</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [user, setUser] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('hanif_user');
                    return saved ? JSON.parse(saved) : null;
                } catch(e) {
                    return null;
                }
            });

            const [authType, setAuthType] = React.useState('staff_login'); 
            const [loginPhone, setLoginPhone] = React.useState('');
            const [loginCode, setLoginCode] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('dashboard');

            const [regStaff, setRegStaff] = React.useState({ name: '', phone: '', email: '' });
            const [regOwner, setRegOwner] = React.useState({ name: '', phone: '', email: '', code: '' });

            const [staffList, setStaffList] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('hanif_staff');
                    return saved ? JSON.parse(saved) : [
                        { id: 1, name: 'জাকির হোসেন', role: 'মালিক (Managing Director)', phone: '01700000001', code: '7771', email: 'zakir@jakirltd.com', salary: 0, snacks: 0, fine: 0, isOwner: true, status: 'Active' },
                        { id: 2, name: 'রফিকুল ইসলাম হৃদয়', role: 'মালিক (Director)', phone: '01700000002', code: '7772', email: 'hriday@jakirltd.com', salary: 0, snacks: 0, fine: 0, isOwner: true, status: 'Active' },
                        { id: 3, name: 'আবু সাকের জীবন', role: 'মালিক (Director)', phone: '01700000003', code: '7773', email: 'jiban@jakirltd.com', salary: 0, snacks: 0, fine: 0, isOwner: true, status: 'Active' },
                        { id: 4, name: 'ফ্যাক্টরি ম্যানেজার', role: 'Manager', phone: '01700000004', code: '', email: 'manager@jakirltd.com', salary: 25000, snacks: 1500, fine: 0, isOwner: false, status: 'Active' }
                    ];
                } catch(e) {
                    return [];
                }
            });

            const [orders, setOrders] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('hanif_orders');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });

            const [productionLogs, setProductionLogs] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('hanif_prod');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });

            React.useEffect(() => {
                localStorage.setItem('hanif_staff', JSON.stringify(staffList));
            }, [staffList]);

            React.useEffect(() => {
                localStorage.setItem('hanif_orders', JSON.stringify(orders));
            }, [orders]);

            React.useEffect(() => {
                localStorage.setItem('hanif_prod', JSON.stringify(productionLogs));
            }, [productionLogs]);

            const [newOrder, setNewOrder] = React.useState({ customer: '', phone: '', address: '', product: 'হানিফ পলিমার ডোর', qty: 1, price: 0, advance: 0 });
            const [newProd, setNewProd] = React.useState({ item: 'হানিফ পলিমার ডোর', qty: '', note: '', photo: null });
            const [selectedChallan, setSelectedChallan] = React.useState(null);

            const handleStaffLogin = (e) => {
                e.preventDefault();
                const found = staffList.find(s => s.phone.trim() === loginPhone.trim() && !s.isOwner);
                if (found) {
                    if (found.status !== 'Active') {
                        alert('আপনার অ্যাকাউন্টটি এখনও মালিক কর্তৃক কনফার্ম করা হয়নি।');
                        return;
                    }
                    setUser(found);
                    localStorage.setItem('hanif_user', JSON.stringify(found));
                } else {
                    alert('কর্মী বা ম্যানেজারের এই নম্বরটি পাওয়া যায়নি!');
                }
            };

            const handleOwnerLogin = (e) => {
                e.preventDefault();
                const found = staffList.find(s => s.phone.trim() === loginPhone.trim() && s.isOwner);
                if (found) {
                    if (found.code !== loginCode) {
                        alert('ভুল সিকিউরিটি কোড!');
                        return;
                    }
                    setUser(found);
                    localStorage.setItem('hanif_user', JSON.stringify(found));
                } else {
                    alert('মালিকের এই নম্বরটি রেজিস্টার্ড নয়!');
                }
            };

            const handleStaffRegister = (e) => {
                e.preventDefault();
                if(!regStaff.phone.startsWith('01') || regStaff.phone.length !== 11) {
                    alert('সঠিক ১১ ডিজিটের বাংলাদেশি মোবাইল নম্বর দিন');
                    return;
                }
                if(staffList.some(s => s.phone === regStaff.phone)) {
                    alert('এই নম্বর দিয়ে ইতিমধ্যে অ্যাকাউন্ট আছে!');
                    return;
                }
                const newObj = {
                    id: staffList.length + 1,
                    name: regStaff.name,
                    role: 'অনির্ধারিত পদ',
                    phone: regStaff.phone,
                    code: '',
                    email: regStaff.email || 'N/A',
                    salary: 0,
                    snacks: 0,
                    fine: 0,
                    isOwner: false,
                    status: 'Pending'
                };
                setStaffList([...staffList, newObj]);
                alert('রেজিস্ট্রেশন সফল হয়েছে! মালিক আপনার পদ ও বেতন সেট করার পর লগইন করতে পারবেন।');
                setAuthType('staff_login');
                setRegStaff({ name: '', phone: '', email: '' });
            };

            const handleOwnerRegister = (e) => {
                e.preventDefault();
                if(!regOwner.phone.startsWith('01') || regOwner.phone.length !== 11) {
                    alert('সঠিক ১১ ডিজিটের বাংলাদেশি মোবাইল নম্বর দিন');
                    return;
                }
                if(staffList.some(s => s.phone === regOwner.phone)) {
                    alert('এই নম্বর দিয়ে ইতিমধ্যে অ্যাকাউন্ট আছে!');
                    return;
                }
                const newOwnerObj = {
                    id: staffList.length + 1,
                    name: regOwner.name,
                    role: 'মালিক (Director)',
                    phone: regOwner.phone,
                    code: regOwner.code,
                    email: regOwner.email || 'N/A',
                    salary: 0,
                    snacks: 0,
                    fine: 0,
                    isOwner: true,
                    status: 'Active'
                };
                setStaffList([...staffList, newOwnerObj]);
                alert('মালিকের অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে! এখন সিকিউরিটি কোড দিয়ে লগইন করুন।');
                setAuthType('owner_login');
                setRegOwner({ name: '', phone: '', email: '', code: '' });
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('hanif_user');
            };

            const handleMasterLogout = () => {
                if(confirm('সবার অ্যাকাউন্ট লগআউট করতে চান?')) {
                    localStorage.removeItem('hanif_user');
                    setUser(null);
                }
            };

            const handleConfirmStaff = (id) => {
                setStaffList(staffList.map(s => s.id === id ? { ...s, status: 'Active' } : s));
                alert('অ্যাকাউন্ট কনফার্ম ও সচল করা হয়েছে!');
            };

            const handleUpdateStaffDetails = (id, field, value) => {
                setStaffList(staffList.map(s => {
                    if(s.id === id) {
                        return { ...s, [field]: field === 'salary' || field === 'snacks' || field === 'fine' ? Number(value) : value };
                    }
                    return s;
                }));
            };

            const handleCreateOrder = (e) => {
                e.preventDefault();
                const total = newOrder.qty * newOrder.price;
                const due = total - newOrder.advance;
                const orderObj = {
                    id: `MEMO-${1000 + orders.length + 1}`,
                    customer: newOrder.customer,
                    phone: newOrder.phone,
                    address: newOrder.address,
                    product: newOrder.product,
                    qty: newOrder.qty,
                    total: total,
                    advance: newOrder.advance,
                    due: due,
                    status: 'প্রোডাকশনে আছে'
                };
                setOrders([...orders, orderObj]);
                setNewOrder({ customer: '', phone: '', address: '', product: 'হানিফ পলিমার ডোর', qty: 1, price: 0, advance: 0 });
                alert('নতুন মেমো সফলভাবে সংরক্ষিত হয়েছে!');
            };

            const handlePhotoCapture = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setNewProd({...newProd, photo: reader.result});
                    reader.readAsDataURL(file);
                }
            };

            const handleAddProduction = (e) => {
                e.preventDefault();
                if(!newProd.qty) return;
                setProductionLogs([...productionLogs, {
                    id: productionLogs.length + 1,
                    date: new Date().toLocaleDateString('bn-BD'),
                    item: newProd.item,
                    qty: Number(newProd.qty),
                    status: newProd.note || 'স্টক আপডেট',
                    photo: newProd.photo
                }]);
                setNewProd({ item: 'হানিফ পলিমার ডোর', qty: '', note: '', photo: null });
                alert('প্রোডাকশন স্টক আপডেট হয়েছে!');
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950 text-slate-100">
                        <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-md space-y-4">
                            <div className="text-center">
                                <h1 className="text-xl font-bold text-emerald-400">হানিফ ডোর</h1>
                                <p className="text-xs text-slate-400">জাকির লিমিটেড ম্যানেজমেন্ট সিস্টেম</p>
                            </div>

                            <div className="grid grid-cols-2 gap-1 bg-slate-800 p-1 rounded-xl text-xs font-semibold">
                                <button onClick={() => setAuthType('staff_login')} className={`py-2 rounded-lg ${authType === 'staff_login' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>কর্মী লগইন</button>
                                <button onClick={() => setAuthType('owner_login')} className={`py-2 rounded-lg ${authType === 'owner_login' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>👑 মালিক লগইন</button>
                                <button onClick={() => setAuthType('staff_reg')} className={`py-2 rounded-lg ${authType === 'staff_reg' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>কর্মী রেজিস্ট্রেশন</button>
                                <button onClick={() => setAuthType('owner_reg')} className={`py-2 rounded-lg ${authType === 'owner_reg' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>👑 মালিক রেজিস্ট্রেশন</button>
                            </div>

                            {authType === 'staff_login' && (
                                <form onSubmit={handleStaffLogin} className="space-y-3">
                                    <div>
                                        <label className="block text-xs text-slate-300 mb-1">কর্মী মোবাইল নম্বর</label>
                                        <input type="text" required placeholder="017xxxxxxxx" value={loginPhone} onChange={(e) => setLoginPhone(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white text-center" />
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg">প্রবেশ করুন</button>
                                </form>
                            )}

                            {authType === 'owner_login' && (
                                <form onSubmit={handleOwnerLogin} className="space-y-3">
                                    <div>
                                        <label className="block text-xs text-slate-300 mb-1">মালিকের মোবাইল নম্বর</label>
                                        <input type="text" required placeholder="01700000001" value={loginPhone} onChange={(e) => setLoginPhone(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white text-center" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-300 mb-1">সিকিউরিটি কোড</label>
                                        <input type="password" required placeholder="কোড দিন" value={loginCode} onChange={(e) => setLoginCode(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white text-center" />
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg">মালিক হিসেবে প্রবেশ</button>
                                    <p className="text-[11px] text-slate-400 bg-slate-800/60 p-2 rounded">ডেমো: জাকির (`01700000001`, কোড: `7771`), হৃদয় (`01700000002`, কোড: `7772`), জীবন (`01700000003`, কোড: `7773`)</p>
                                </form>
                            )}

                            {authType === 'staff_reg' && (
                                <form onSubmit={handleStaffRegister} className="space-y-2.5 text-xs">
                                    <div>
                                        <label className="text-slate-400 mb-1 block">পূর্ণ নাম</label>
                                        <input type="text" required placeholder="নাম লিখুন" value={regStaff.name} onChange={(e) => setRegStaff({...regStaff, name: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white" />
                                    </div>
                                    <div>
                                        <label className="text-slate-400 mb-1 block">মোবাইল নম্বর</label>
                                        <input type="text" required placeholder="017xxxxxxxx" value={regStaff.phone} onChange={(e) => setRegStaff({...regStaff, phone: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white" />
                                    </div>
                                    <div>
                                        <label className="text-slate-400 mb-1 block">জিমেইল</label>
                                        <input type="email" placeholder="example@gmail.com" value={regStaff.email} onChange={(e) => setRegStaff({...regStaff, email: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white" />
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-600 text-white font-semibold py-2.5 rounded-lg mt-1">কর্মী রেজিস্ট্রেশন</button>
                                </form>
                            )}

                            {authType === 'owner_reg' && (
                                <form onSubmit={handleOwnerRegister} className="space-y-2.5 text-xs">
                                    <div>
                                        <label className="text-slate-400 mb-1 block">মালিকের নাম</label>
                                        <input type="text" required placeholder="নাম লিখুন" value={regOwner.name} onChange={(e) => setRegOwner({...regOwner, name: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white" />
                                    </div>
                                    <div>
                                        <label className="text-slate-400 mb-1 block">মোবাইল নম্বর</label>
                                        <input type="text" required placeholder="017xxxxxxxx" value={regOwner.phone} onChange={(e) => setRegOwner({...regOwner, phone: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white" />
                                    </div>
                                    <div>
                                        <label className="text-slate-400 mb-1 block">জিমেইল</label
